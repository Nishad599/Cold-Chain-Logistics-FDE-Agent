# Local stack for the Cold-Chain FDE project (runs on Docker Desktop, no cloud).
#   docker compose up -d --build   -> starts Postgres + the Streamlit app
services:
  db:
    # Postgres 16 with the pgvector extension pre-installed (fleet data + SOP vectors in one DB)
    image: pgvector/pgvector:pg16
    env_file: .env
    ports:
      - "127.0.0.1:${PG_PORT:-5432}:5432"   # only reachable from this machine; host port comes from .env
    volumes:
      - pg_data:/var/lib/postgresql/data
      # Every script in db/init runs ONCE, on the very first start (empty volume)
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10

  app:
    build: .
    env_file: .env
    environment:
      PG_HOST: db                                       # inside Docker, the DB is reached by service name...
      PG_PORT: 5432                                     # ...on its container port (not the host port)
      OLLAMA_BASE_URL: http://host.docker.internal:11434 # Ollama runs on the host machine
    ports:
      - "127.0.0.1:8501:8501"   # only this machine can open the UI
    volumes:
      - hf_cache:/root/.cache/huggingface               # keep the downloaded embedding model between restarts
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  kafka:
    # Single-node Kafka in KRaft mode (no ZooKeeper) for the live telemetry simulation
    image: apache/kafka:3.9.1
    ports:
      - "127.0.0.1:29092:29092"   # host scripts connect here; containers use kafka:9092
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,HOST://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,HOST://127.0.0.1:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1   # single broker, so no replicas
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null"]
      interval: 5s
      retries: 20

  # Same image as the app, different command
  telemetry-producer:
    build: .
    command: ["python", "-u", "scripts/telemetry_producer.py"]
    env_file: .env
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  telemetry-consumer:
    build: .
    command: ["python", "-u", "scripts/telemetry_consumer.py"]
    env_file: .env
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      PG_HOST: db
      PG_PORT: 5432
    depends_on:
      kafka:
        condition: service_healthy
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pg_data:
  hf_cache:
